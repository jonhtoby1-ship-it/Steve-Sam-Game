<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Super Football Multijoueur</title>
  <link rel="stylesheet" href="style.css">
  <!-- Librairie PeerJS pour la connexion multijoueur téléphone à téléphone -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div class="game-container">
    <!-- Barre de Configuration des Options -->
    <div class="setup-bar">
      <!-- OPTION 1 : Nombre de joueurs sur le terrain par équipe -->
      <label>Format : 
        <select id="teamFormat">
          <option value="1">1 vs 1</option>
          <option value="2" selected>2 vs 2</option>
          <option value="3">3 vs 3</option>
          <option value="4">4 vs 4</option>
        </select>
      </label>

      <!-- OPTION 2 : Nombre de joueurs humains sur le téléphone -->
      <label>Humains (sur tel) : 
        <select id="humanCount">
          <option value="1">1 Joueur (vs IA)</option>
          <option value="2">2 Joueurs</option>
          <option value="3">3 Joueurs</option>
          <option value="4">4 Joueurs</option>
        </select>
      </label>

      <!-- OPTION 3 : Durée du match -->
      <label>Durée : 
        <select id="gameDuration">
          <option value="120">2 Mins</option>
          <option value="180" selected>3 Mins</option>
          <option value="240">4 Mins</option>
          <option value="300">5 Mins</option>
        </select>
      </label>

      <button id="btnMusic">🎵 Musique: ON</button>
    </div>

    <!-- Panneau de Connexion Réseau (Téléphone à Téléphone) -->
    <div class="network-panel">
      <button id="btnCreateRoom" class="net-btn">🌐 Créer Salon (Hôte)</button>
      <div class="join-box">
        <input type="text" id="roomInput" placeholder="Code (ex: 1234)" maxlength="4">
        <button id="btnJoinRoom" class="net-btn">🔗 Rejoindre</button>
      </div>
      <span id="networkStatus" class="net-status">Mode Local (Même écran)</span>
    </div>

    <!-- Tableau d'affichage du score et temps -->
    <header class="scoreboard">
      <div class="team team-1">
        <span class="team-name">BLEUS</span>
        <span id="score1" class="score">0</span>
      </div>
      
      <div class="timer-container">
        <span id="timer">03:00</span>
        <span id="game-status" class="status">ROUND 1</span>
      </div>

      <div class="team team-2">
        <span id="score2" class="score">0</span>
        <span class="team-name">ROUGES</span>
      </div>
    </header>

    <!-- Terrain de Jeu Canvas -->
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <!-- Zone des Contrôles Tactiles -->
    <div class="controls-wrapper">
      <div class="player-touch-zone" id="p1-controls">
        <span class="p-label" style="color: #00d2ff;">Commandes Tactiles</span>
        <div class="controls-layout">
          <div class="d-pad">
            <div></div><button class="t-btn" id="btnUp">⬆️</button><div></div>
            <button class="t-btn" id="btnLeft">⬅️</button><div></div><button class="t-btn" id="btnRight">➡️</button>
            <div></div><button class="t-btn" id="btnDown">⬇️</button><div></div>
          </div>
          <div class="act-btns">
            <button class="t-btn btn-pass" id="btnPass">PASSE</button>
            <button class="t-btn btn-shoot" id="btnShoot">TIR</button>
          </div>
        </div>
      </div>

      <div class="center-actions">
        <button id="btnPause">⏸️ Pause</button>
        <button id="btnReset">🔄 Recommencer</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
