<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Jeu de Football 1v1</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div class="game-container">
    
    <!-- Barre Supérieure : Durée et Contrôles du Jeu -->
    <div class="setup-bar">
      <div>
        <label for="gameDuration" style="font-size: 0.8rem;">Durée :</label>
        <select id="gameDuration">
          <option value="60">1 Min</option>
          <option value="180" selected>3 Min</option>
          <option value="300">5 Min</option>
        </select>
      </div>

      <div>
        <button id="btnPause">⏸️ Pause</button>
        <button id="btnReset">🔄 Recommencer</button>
        <button id="btnMusic">🎵 Musique: ON</button>
      </div>
    </div>

    <!-- Panneau Multijoueur (PeerJS) -->
    <div class="network-panel">
      <button id="btnCreateRoom" class="net-btn">Créer Salon</button>
      <div class="join-box">
        <input type="text" id="roomInput" placeholder="Code" maxlength="4" />
        <button id="btnJoinRoom" class="net-btn">Rejoindre</button>
      </div>
      <div id="networkStatus" class="net-status">Mode Solo (vs IA)</div>
    </div>

    <!-- Tableau de Score et Chronomètre -->
    <div class="scoreboard">
      <div class="team team-1">
        <span class="team-name">J1</span>
        <span class="score" id="score1">0</span>
      </div>

      <div style="text-align: center;">
        <div id="timer">01:30</div>
        <span class="status" id="game-status">PRÊT ?</span>
      </div>

      <div class="team team-2">
        <span class="score" id="score2">0</span>
        <span class="team-name">IA</span>
      </div>
    </div>

    <!-- Terrain de Jeu -->
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <!-- Zone des Commandes Tactiles (Boutons de Direction + Tir) -->
    <div class="controls-wrapper">
      <div class="player-touch-zone">
        <div class="controls-layout">
          
          <!-- Croix Directionnelle (Flèches) -->
          <div class="d-pad">
            <button class="t-btn" id="btnUp" style="grid-column: 2; grid-row: 1;">⬆️</button>
            <button class="t-btn" id="btnLeft" style="grid-column: 1; grid-row: 2;">⬅️</button>
            <button class="t-btn" id="btnRight" style="grid-column: 3; grid-row: 2;">➡️</button>
            <button class="t-btn" id="btnDown" style="grid-column: 2; grid-row: 3;">⬇️</button>
          </div>

          <!-- Bouton d'Action Unique : Tirer -->
          <div class="act-btns">
            <button class="t-btn btn-shoot" id="btnShoot">TIRER ⚽</button>
          </div>

        </div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
